<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img">
<title>Charge amplifier for PL033.31 at 200 lbf (current design)</title>
<desc>One of three charge-amplifier channels on an MCP6004 quad op amp: 6.8 uF film Cf, 10 Mohm Rf, 4.7 k Rin, back-to-back 5.1 V zeners across the PL033.31 chip, 1N4148 input clamps, 1 k / 100 nF output filter to the UNO Q ADC, plus the shared 0.30 V reference buffer and supply decoupling. Powered from the UNO Q 3.3 V pin.</desc>
